<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Владислав Афонин — Afonin Web Studio</title>
  <meta name="description" content="Сайты, Telegram-боты, AI и веб-приложения для бизнеса. Владислав Афонин — full-stack разработчик. Гюмри, Ереван, онлайн. Бесплатный макет до оплаты.">
  <meta name="theme-color" content="#0b0c0a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230b0c0a'/%3E%3Cpath d='M8 47 25 14 42 47H31L25 34 18 47Z' fill='%23f2f4ee'/%3E%3Cpath d='m30 33 8 14 18-33H45l-7 14-3-5Z' fill='%23b6ff1f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/fonts.css">
  <style>
    html,body{background:#0b0c0a}
    #preloader{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#0b0c0a;transition:opacity .5s ease,visibility .5s ease}
    #preloader.is-done{opacity:0;visibility:hidden}
    .preloader-inner{display:flex;flex-direction:column;align-items:center;gap:26px}
    .preloader-mark{width:110px;height:auto;overflow:visible}
    .preloader-mark path{animation:pl-rise 1.1s ease-in-out infinite alternate}
    .preloader-mark .pl-w{animation-delay:.25s}
    .preloader-bar{width:140px;height:2px;background:#292e22;overflow:hidden;border-radius:2px}
    .preloader-bar span{display:block;height:100%;width:40%;background:#b6ff1f;animation:pl-slide 1.2s ease-in-out infinite}
    @keyframes pl-rise{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:translateY(-4px)}}
    @keyframes pl-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
    @media(prefers-reduced-motion:reduce){.preloader-mark path,.preloader-bar span{animation:none}}
  </style>
</head>
<body>
  <div id="preloader" role="status" aria-label="Loading">
    <div class="preloader-inner">
      <svg class="preloader-mark" viewBox="6 12 52 37" aria-hidden="true"><path class="pl-a" d="M8 47 25 14 42 47H31L25 34 18 47Z" fill="#f2f4ee"/><path class="pl-w" d="m30 33 8 14 18-33H45l-7 14-3-5Z" fill="#b6ff1f"/></svg>
      <div class="preloader-bar"><span></span></div>
    </div>
  </div>
  <div id="root"></div><script type="module" src="/src/main.jsx"></script>
</body></html>
