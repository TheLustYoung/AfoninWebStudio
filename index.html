<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Владислав Афонин — Afonin Web Studio</title>
  <meta name="description" content="Сайты, Telegram-боты, AI и веб-приложения для бизнеса. Владислав Афонин — full-stack разработчик. Гюмри, Ереван, онлайн. Бесплатный макет до оплаты.">
  <meta name="theme-color" content="#0b0c0a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230b0c0a'/%3E%3Cpath d='M8 47 25 14 42 47H31L25 34 18 47Z' fill='%23f2f4ee'/%3E%3Cpath d='m30 33 8 14 18-33H45l-7 14-3-5Z' fill='%23b6ff1f'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="/assets/logo-mark.png">
  <link rel="preload" as="image" href="/assets/preloader.webp">
  <link rel="stylesheet" href="/assets/fonts.css">
  <style>
    html,body{background:#0b0c0a}
    #preloader{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#000;overflow:hidden;transition:opacity .6s ease,visibility .6s ease}
    #preloader.is-done{opacity:0;visibility:hidden}
    .preloader-art{position:absolute;inset:0;display:grid;place-items:center;isolation:isolate;background:#000}
    .preloader-art img{width:min(100vw,100vh);height:min(100vw,100vh);object-fit:cover}
    .preloader-art:after{content:'';position:absolute;inset:0;background:#b6ff1f;mix-blend-mode:multiply}
    .preloader-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:30px}
    .preloader-logo{width:130px;height:auto;filter:drop-shadow(0 0 18px rgba(182,255,31,.35));animation:pl-breathe 1.6s ease-in-out infinite alternate}
    .preloader-bar{width:150px;height:2px;background:#292e22;overflow:hidden;border-radius:2px}
    .preloader-bar span{display:block;height:100%;width:40%;background:#b6ff1f;box-shadow:0 0 10px #b6ff1f;animation:pl-slide 1.2s ease-in-out infinite}
    @keyframes pl-breathe{from{opacity:.75;transform:scale(.96)}to{opacity:1;transform:scale(1.03)}}
    @keyframes pl-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
    @media(prefers-reduced-motion:reduce){.preloader-logo,.preloader-bar span{animation:none}}
  </style>
</head>
<body>
  <div id="preloader" role="status" aria-label="Loading">
    <div class="preloader-art" aria-hidden="true"><img src="/assets/preloader.webp" width="480" height="480" alt=""></div>
    <div class="preloader-inner">
      <img class="preloader-logo" src="/assets/logo-mark.png" width="162" height="87" alt="Afonin Web Studio">
      <div class="preloader-bar"><span></span></div>
    </div>
  </div>
  <div id="root"></div><script type="module" src="/src/main.jsx"></script>
</body></html>
